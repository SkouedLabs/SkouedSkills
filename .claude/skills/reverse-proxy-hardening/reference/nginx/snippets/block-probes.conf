# /etc/nginx/snippets/block-probes.conf
# Included at the end of each HTTPS server. Regex locations win over prefix locations:
# remove any pattern the application legitimately serves.
# Hits return 404 and go to probe.log only, which feeds the nginx-probe fail2ban jail.

# Dotfiles and VCS metadata, except /.well-known/
location ~ /\.(?!well-known/) {
    access_log /var/log/nginx/probe.log main_ext;
    return 404;
}

# Backups, dumps, archives, keys and configuration files
location ~* \.(?:bak|old|orig|save|swp|tmp|sql|sqlite3?|db|dump|tar|tgz|gz|zip|7z|rar|log|ini|conf|cfg|env|pem|key|crt|p12|pfx|jks|ya?ml|toml|lock)$ {
    access_log /var/log/nginx/probe.log main_ext;
    return 404;
}

# Server-side scripts this proxy never serves
location ~* \.(?:php[0-9]?|phtml|phar|asp|aspx|ashx|jsp|jspx|do|action|cgi|pl|py|sh|exe|dll)$ {
    access_log /var/log/nginx/probe.log main_ext;
    return 404;
}

# Source maps
location ~* \.map$ {
    access_log /var/log/nginx/probe.log main_ext;
    return 404;
}

# Well-known scanner targets
location ~* ^/(?:wp-admin|wp-login|wp-content|wp-includes|wp-json|xmlrpc|phpmyadmin|pma|myadmin|adminer|cgi-bin|vendor/phpunit|actuator|server-status|server-info|_profiler|telescope|_ignition|solr|jenkins|manager/html|owa|ecp|autodiscover|remote/login|global-protect|dana-na|HNAP1|boaform|GponForm|setup\.cgi|druid|nacos|console|debug|swagger|api-docs|v2/api-docs|graphiql)(?:/|$) {
    access_log /var/log/nginx/probe.log main_ext;
    return 404;
}
