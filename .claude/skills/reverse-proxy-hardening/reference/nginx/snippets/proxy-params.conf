# /etc/nginx/snippets/proxy-params.conf
# Included inside every proxying location: a proxy_set_header in a location replaces inherited ones.
# Proxy timeouts are set in nginx.conf so a location can override them without duplicates.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Proxy             "";

proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-Runtime;

proxy_buffer_size 16k;
proxy_buffers     16 16k;

# Non-idempotent requests (POST, PATCH...) are never retried on another upstream.
proxy_next_upstream       error timeout;
proxy_next_upstream_tries 2;

# Remote TLS upstream:
# proxy_ssl_verify              on;
# proxy_ssl_trusted_certificate /etc/nginx/tls/internal-ca.pem;
# proxy_ssl_server_name         on;
# proxy_ssl_protocols           TLSv1.2 TLSv1.3;
