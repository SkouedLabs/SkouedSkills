# /etc/containers/registries.conf.d/00-production.conf  (root:root 0644)
# Images are always fully qualified; no implicit Docker Hub or other search registry.

unqualified-search-registries = []
short-name-mode = "enforcing"

# ADAPT: internal registry, TLS verified with the internal CA
# (/etc/containers/certs.d/registry.example.com/ca.crt).
[[registry]]
location = "registry.example.com"
insecure = false
blocked = false
