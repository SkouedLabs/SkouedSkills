# /etc/systemd/system/nginx.service.d/hardening.conf
# Apply with: systemctl daemon-reload && systemctl restart nginx
# Then check: systemd-analyze security nginx, systemctl reload nginx, nginx -s reopen.
# The master runs as root (binds 80/443, reads keys, opens logs) and drops to the worker user.

[Service]
LimitNOFILE=65535
UMask=0027

NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_KILL
AmbientCapabilities=

ProtectSystem=strict
ReadWritePaths=/run -/var/log/nginx -/var/lib/nginx -/var/cache/nginx
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible

RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes

SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@mount @swap @reboot @raw-io @module @debug @cpu-emulation @obsolete
SystemCallErrorNumber=EPERM
