# /etc/containers/containers.conf.d/50-production.conf  (root:root 0644)
# System-wide defaults for every rootless account. Quadlet keys still set them explicitly
# per container; these are the safety net for anything started manually.

[containers]
log_driver = "journald"
default_ulimits = ["core=0:0"]
pids_limit = 1024
ipcns = "private"
pidns = "private"
utsns = "private"
cgroupns = "private"

[engine]
events_logger = "journald"
runtime = "crun"

[network]
default_rootless_network_cmd = "pasta"
