# /etc/fail2ban/filter.d/nginx-probe.conf
# Every line of probe.log is a hit (catch-all server, probe locations, flagged user agents and URIs).
# The date is removed before matching, so "[02/Nov/2026:10:00:00 +0000]" becomes "[]".

[Definition]
failregex   = ^<HOST> - \S+ \[\] "[^"]*" \d{3}\s
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
