# /etc/nginx/conf.d/app.example.com.conf
# ADAPT: server_name, certificate paths, upstream, location paths and sizes.
# First issuance: comment the 443 server, obtain the certificate, then enable it.

upstream app_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name app.example.com;

    access_log /var/log/nginx/app.example.com.access.log main_ext;
    error_log  /var/log/nginx/app.example.com.error.log warn;

    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    access_log /var/log/nginx/app.example.com.access.log main_ext;
    access_log /var/log/nginx/probe.log main_ext if=$probe_hit;
    error_log  /var/log/nginx/app.example.com.error.log warn;

    include /etc/nginx/snippets/security-headers.conf;

    # Only "return" inside server-level "if".
    if ($method_allowed = 0) { return 405; }
    if ($probe_hit)          { return 444; }
    # if ($f2b_banned)       { return 403; }   # behind a load balancer only

    limit_conn conn_ip 64;
    limit_req  zone=req_global burst=60 nodelay;

    location / {
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /assets/ {
        gzip       on;
        gzip_types text/css application/javascript image/svg+xml application/json;
        expires    30d;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/ {
        limit_req zone=req_api burst=20 delay=10;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Login, password reset, MFA and token endpoints.
    location ~ ^/api/v1/auth/(login|password-reset|mfa|token)$ {
        limit_req zone=req_auth burst=5 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/uploads {
        client_max_body_size 50m;
        client_body_timeout  60s;
        limit_req zone=req_heavy burst=5 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        limit_req zone=req_api burst=10 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 1h;
    }

    # Admin endpoints: IP allowlist (allowlists/admin.geo) on top of application authentication.
    # 404 rather than 403 so the path is not confirmed to non-allowed clients.
    location /admin/ {
        if ($admin_allowed = 0) { return 404; }
        limit_req zone=req_api burst=20 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/admin/ {
        if ($admin_allowed = 0) { return 404; }
        limit_req zone=req_api burst=20 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /.well-known/security.txt {
        root /var/www/wellknown;
    }

    include /etc/nginx/snippets/block-probes.conf;
}
