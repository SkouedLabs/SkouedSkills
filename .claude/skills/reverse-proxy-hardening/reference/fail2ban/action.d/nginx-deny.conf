# /etc/fail2ban/action.d/nginx-deny.conf
# Bans at the Nginx level, for hosts behind a load balancer or CDN where a firewall ban
# would block the balancer. Requires real_ip in nginx.conf, the "geo $f2b_banned" block
# and "if ($f2b_banned) { return 403; }" in each server.
# Usage in a jail: action = nginx-deny
# SELinux: fail2ban writing under /etc/nginx and reloading nginx may raise AVCs; check
# `ausearch -m AVC -ts recent` and add a local policy module if needed.

[Definition]
actionstart = install -d -m 0755 /etc/nginx/fail2ban
              touch <denyfile>
actionflush = : > <denyfile>
              <nginx_reload>
actionstop  = %(actionflush)s
actioncheck =
actionban   = grep -qxF '<ip> 1;' <denyfile> || { echo '<ip> 1;' >> <denyfile> && <nginx_reload>; }
actionunban = grep -vxF '<ip> 1;' <denyfile> > <denyfile>.tmp; mv -f <denyfile>.tmp <denyfile>; <nginx_reload>

[Init]
denyfile     = /etc/nginx/fail2ban/banned.conf
nginx_reload = nginx -t -q && systemctl reload nginx
