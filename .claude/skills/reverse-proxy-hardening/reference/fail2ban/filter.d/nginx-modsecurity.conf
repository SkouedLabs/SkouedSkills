# /etc/fail2ban/filter.d/nginx-modsecurity.conf
# Requests blocked by ModSecurity v3 (libmodsecurity + ModSecurity-nginx connector) in the error log.

[Definition]
failregex   = ^\s*\[[a-z]+\] \d+#\d+: \*\d+ \[client <HOST>\] ModSecurity: Access denied with code \d+
              ^\s*\[[a-z]+\] \d+#\d+: \*\d+ ModSecurity: Access denied with code \d+.*, client: <HOST>,
ignoreregex =
datepattern = {^LN-BEG}
