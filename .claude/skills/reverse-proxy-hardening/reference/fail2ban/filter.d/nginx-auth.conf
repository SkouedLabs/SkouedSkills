# /etc/fail2ban/filter.d/nginx-auth.conf
# Failed application logins: POST to the login endpoint answered with 401 or 403.
# Override the path from the jail: filter = nginx-auth[auth_path="/login"]

[Definition]
auth_path   = /api/v1/auth/login
failregex   = ^<HOST> - \S+ \[\] "POST %(auth_path)s(?:\?[^ "]*)? HTTP/[\d.]+" (?:401|403)\s
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
