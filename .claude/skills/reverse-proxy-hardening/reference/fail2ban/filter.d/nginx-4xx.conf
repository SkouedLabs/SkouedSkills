# /etc/fail2ban/filter.d/nginx-4xx.conf
# Bursts of client errors in the main_ext access logs (enumeration, fuzzing).

[Definition]
failregex   = ^<HOST> - \S+ \[\] "[^"]*" (?:400|401|403|404|405|444)\s
ignoreregex = ^<HOST> - \S+ \[\] "(?:GET|HEAD) /(?:favicon\.ico|robots\.txt|apple-touch-icon[^ "]*\.png)\s
datepattern = ^[^\[]*\[({DATE})
