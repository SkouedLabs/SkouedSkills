# /etc/nginx/conf.d/00-default.conf
# Catch-all: requests for an unknown Host/SNI or by bare IP never reach an application.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/probe.log main_ext;
    return 444;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
