# /etc/nginx/snippets/security-headers.conf
# Included at server level. Any add_header in a location drops all of these for that location.
# A single layer owns the CSP: remove it here if the application sends its own.

add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy      "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
