# /etc/nginx/nginx.conf
# Values to adapt are marked "ADAPT".

user nginx;                                   # ADAPT: www-data with the Debian/Ubuntu distro package
worker_processes auto;
worker_rlimit_nofile 65535;                   # within LimitNOFILE of the systemd drop-in
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Dynamic modules, only when one is required. ADAPT to the package source:
#   Debian/Ubuntu distro: include /etc/nginx/modules-enabled/*.conf;
#   AlmaLinux AppStream:  include /usr/share/nginx/modules/*.conf;
#   nginx.org packages:   load_module modules/<module>.so;

events {
    worker_connections 4096;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    server_tokens off;
    autoindex     off;
    ssi           off;
    gzip          off;                        # enabled per static location only (BREACH)

    # Request size and timeouts (slow-loris, memory exhaustion)
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_max_body_size        1m;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    keepalive_requests          1000;
    reset_timedout_connection   on;

    # Upstream timeouts; long-lived locations (uploads, WebSocket) override proxy_read_timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # TLS defaults: Mozilla intermediate, hybrid post-quantum key exchange.
    # X25519MLKEM768 requires OpenSSL >= 3.5 (`nginx -V`); remove it otherwise or nginx will not start.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_session_cache         shared:TLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_early_data            off;

    # Real client IP, only behind a load balancer or CDN. ADAPT: list its ranges only.
    # set_real_ip_from  192.0.2.10;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # Logs: combined prefix parsed by fail2ban, extra fields appended.
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                        'ua=$upstream_addr host=$host rid=$request_id tls=$ssl_protocol';

    log_format json escape=json '{"time":"$time_iso8601","client":"$remote_addr","host":"$host",'
                                '"method":"$request_method","uri":"$uri","status":$status,'
                                '"bytes":$body_bytes_sent,"rt":"$request_time","urt":"$upstream_response_time",'
                                '"upstream":"$upstream_addr","ua":"$http_user_agent","rid":"$request_id","tls":"$ssl_protocol"}';

    access_log /var/log/nginx/access.log main_ext;

    # Rate limiting. Exempt networks get an empty key and are never counted.
    geo $rl_exempt {
        default      0;
        127.0.0.1/32 1;
        ::1/128      1;
        # 192.0.2.0/24 1;                     # ADAPT: monitoring, internal ranges
    }
    map $rl_exempt $rl_key {
        0 $binary_remote_addr;
        1 "";
    }

    limit_req_zone  $rl_key zone=req_global:20m rate=30r/s;
    limit_req_zone  $rl_key zone=req_api:20m    rate=10r/s;
    limit_req_zone  $rl_key zone=req_auth:10m   rate=5r/m;
    limit_req_zone  $rl_key zone=req_heavy:10m  rate=1r/s;
    limit_conn_zone $rl_key zone=conn_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Admin allowlist (see allowlists/admin.geo). Non-listed clients get 404 on admin locations.
    geo $admin_allowed {
        default 0;
        include /etc/nginx/allowlists/admin.geo;
    }

    # Allowed methods (case-sensitive regex).
    map $request_method $method_allowed {
        default 0;
        "~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$" 1;
    }

    # Scanner and malformed user agents.
    map $http_user_agent $bad_ua {
        default 0;
        ""      1;
        "~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|wpscan|dirbuster|gobuster|ffuf|feroxbuster|wfuzz|acunetix|netsparker|openvas|nessus|whatweb|jaeles|commix|hydra|zmeu|morfeus)" 1;
        "~*(\$\{|%24%7b)"  1;
        # "~*(python-requests|go-http-client|libwww-perl|curl/|wget/)" 1;   # only if no legitimate client uses them
    }

    # Injection markers and encoded traversal in the raw request URI.
    map $request_uri $bad_uri {
        default 0;
        "~*(\$\{|%24%7b)(jndi|env|lower|upper|base64|::-)" 1;
        "~*(\.\./|\.\.%2f|%2e%2e(/|%2f)|%252e%252e)"          1;
        "~*%00"                                                1;
    }

    map "$bad_ua$bad_uri" $probe_hit {
        "00"    0;
        default 1;
    }

    # WebSocket upgrade; empty Connection header keeps upstream keepalive for normal requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Nginx-level fail2ban deny list, only behind a load balancer (fail2ban/action.d/nginx-deny.conf).
    # geo $f2b_banned {
    #     default 0;
    #     include /etc/nginx/fail2ban/banned.conf;
    # }

    include /etc/nginx/conf.d/*.conf;
}
